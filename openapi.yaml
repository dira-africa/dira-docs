openapi: 3.0.3
info:
  title: Dira Africa API
  version: 1.0.0
  description: Public API and Admin operations for Dira weather sensing network.
paths:
  /public/hedera-anchors:
    get:
      summary: Retrieve latest anchors from Hedera HCS
      responses:
        '200':
          description: List of HCS anchors
  /api/admin/hedera/anchor:
    post:
      summary: Trigger catchup anchoring to HCS
      security:
        - bearerAuth: []
      responses:
        '200':
          description: HCS anchoring triggered
  /api/admin/hedera/status:
    get:
      summary: Get Hedera HCS and HTS connection status
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Hedera integration status details
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
